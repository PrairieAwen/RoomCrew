<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="人物家具接触关系">
<title>人物家具接触关系</title><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif}line{stroke-linecap:round}</style>
<rect width="1200" height="620" rx="18" fill="#f8fafc"/>
<text x="28" y="42" font-size="25" fill="#334155" text-anchor="start">03 / 接触点分开登记，动作共享同一规格</text><text x="28" y="76" font-size="16" fill="#64748b" text-anchor="start">侧视关系示意；不是八向投影原画，人物轮廓仅用于说明骨点</text><line x1="70.0000" y1="475.0000" x2="1130.0000" y2="475.0000" stroke="#5f7185" stroke-width="2" /><text x="920" y="507" font-size="17" fill="#334155" text-anchor="start">地面 / z=0</text><rect x="390" y="311" width="125" height="17" rx="6" fill="#a7b398" stroke="#6a7a5b"/><line x1="410.0000" y1="330.0000" x2="410.0000" y2="469.0000" stroke="#61705b" stroke-width="6" /><line x1="365.0000" y1="469.0000" x2="460.0000" y2="469.0000" stroke="#61705b" stroke-width="5" /><line x1="375.0000" y1="310.0000" x2="375.0000" y2="232.0000" stroke="#61705b" stroke-width="7" /><rect x="615" y="210" width="415" height="20" rx="5" fill="#d9ac75" stroke="#9e754c"/><line x1="638.0000" y1="232.0000" x2="638.0000" y2="475.0000" stroke="#9e754c" stroke-width="8" /><line x1="1000.0000" y1="232.0000" x2="1000.0000" y2="475.0000" stroke="#9e754c" stroke-width="8" /><rect x="665" y="199" width="95" height="10" rx="3" fill="#697588"/><line x1="450.0000" y1="311.0000" x2="450.0000" y2="210.0000" stroke="#8c9fae" stroke-width="12" /><line x1="450.0000" y1="311.0000" x2="547.0000" y2="311.0000" stroke="#8c9fae" stroke-width="9" /><line x1="547.0000" y1="311.0000" x2="547.0000" y2="469.0000" stroke="#8c9fae" stroke-width="9" /><line x1="535.0000" y1="470.0000" x2="574.0000" y2="470.0000" stroke="#536779" stroke-width="7" /><line x1="455.0000" y1="222.0000" x2="540.0000" y2="250.0000" stroke="#8c9fae" stroke-width="8" /><line x1="540.0000" y1="250.0000" x2="695.0000" y2="205.0000" stroke="#8c9fae" stroke-width="8" /><circle cx="450" cy="168" r="37" fill="#e6edf3" stroke="#8c9fae" stroke-width="4"/><circle cx="450" cy="475" r="6" fill="#426caa" stroke="white" stroke-width="2"/><circle cx="410" cy="475" r="6" fill="#946c3a" stroke="white" stroke-width="2"/><circle cx="450" cy="311" r="6" fill="#ae4f4f" stroke="white" stroke-width="2"/><circle cx="547" cy="475" r="6" fill="#3c8b72" stroke="white" stroke-width="2"/><circle cx="695" cy="205" r="6" fill="#3c8b72" stroke="white" stroke-width="2"/><line x1="450.0000" y1="311.0000" x2="450.0000" y2="475.0000" stroke="#426caa" stroke-width="1.3" stroke-dasharray="5 5"/><text x="70" y="148" font-size="20" fill="#334155" text-anchor="start">不同标记各有职责</text><text x="70" y="195" font-size="17" fill="#426caa" text-anchor="start">actor_ground：人物地面根点</text><text x="70" y="232" font-size="17" fill="#946c3a" text-anchor="start">chair_base：椅脚轮中心</text><text x="70" y="269" font-size="17" fill="#ae4f4f" text-anchor="start">pelvis / seat_origin：臀部与座面</text><text x="70" y="306" font-size="17" fill="#3c8b72" text-anchor="start">left/right_sole：左右脚独立</text><text x="70" y="343" font-size="17" fill="#3c8b72" text-anchor="start">left/right_hand：左右手独立</text><line x1="1090.0000" y1="210.0000" x2="1090.0000" y2="475.0000" stroke="#9e754c" stroke-width="1.5" /><text x="1050" y="350" font-size="16" fill="#9e754c" text-anchor="start">桌高</text><text x="1040" y="378" font-size="16" fill="#9e754c" text-anchor="start">0.72 m</text><text x="650" y="565" font-size="17" fill="#334155" text-anchor="start">座高样板 0.44 m；腿部净空、手部接触一起校验</text><text x="55" y="555" font-size="18" fill="#426caa" text-anchor="start">根点不能在坐姿时悄悄换成椅脚</text><text x="55" y="584" font-size="15" fill="#64748b" text-anchor="start">示意图未表达双手双脚全部层次，实际数据必须分别提供</text></svg>