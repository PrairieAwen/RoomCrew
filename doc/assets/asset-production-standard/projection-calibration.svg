<text x="28" y="43" font-size="25" fill="#334155" text-anchor="start">01 / 同一相机、同一地面、同一标尺</text><line x1="285.0000" y1="173.0000" x2="-99.0000" y2="365.0000" stroke="#dbe3eb" stroke-width="1.2" /><line x1="285.0000" y1="173.0000" x2="669.0000" y2="365.0000" stroke="#dbe3eb" stroke-width="1.2" /><line x1="381.0000" y1="221.0000" x2="-3.0000" y2="413.0000" stroke="#dbe3eb" stroke-width="1.2" /><line x1="189.0000" y1="221.0000" x2="573.0000" y2="413.0000" stroke="#dbe3eb" stroke-width="1.2" /><line x1="477.0000" y1="269.0000" x2="93.0000" y2="461.0000" stroke="#dbe3eb" stroke-width="1.2" /><line x1="93.0000" y1="269.0000" x2="477.0000" y2="461.0000" stroke="#dbe3eb" stroke-width="1.2" /><line x1="573.0000" y1="317.0000" x2="189.0000" y2="509.0000" stroke="#dbe3eb" stroke-width="1.2" /><line x1="-3.0000" y1="317.0000" x2="381.0000" y2="509.0000" stroke="#dbe3eb" stroke-width="1.2" /><line x1="669.0000" y1="365.0000" x2="285.0000" y2="557.0000" stroke="#dbe3eb" stroke-width="1.2" /><line x1="-99.0000" y1="365.0000" x2="285.0000" y2="557.0000" stroke="#dbe3eb" stroke-width="1.2" /><polygon points="285.0000,365.0000 381.0000,413.0000 381.0000,295.4245 285.0000,247.4245" fill="#dce9f8" stroke="#50657b" stroke-width="1.5"/><polygon points="285.0000,365.0000 189.0000,413.0000 189.0000,295.4245 285.0000,247.4245" fill="#e6f0e7" stroke="#50657b" stroke-width="1.5"/><polygon points="285.0000,247.4245 381.0000,295.4245 285.0000,343.4245 189.0000,295.4245" fill="#fff0d6" stroke="#50657b" stroke-width="1.5"/><line x1="285.0000" y1="365.0000" x2="381.0000" y2="413.0000" stroke="#c15349" stroke-width="3" /><line x1="285.0000" y1="365.0000" x2="189.0000" y2="413.0000" stroke="#37836b" stroke-width="3" /><line x1="285.0000" y1="365.0000" x2="285.0000" y2="247.4245" stroke="#426caa" stroke-width="3" /><text x="392" y="422" font-size="18" fill="#a7403a" text-anchor="start">+X=(24,12)</text><text x="68" y="422" font-size="18" fill="#26745e" text-anchor="start">+Y=(-24,12)</text><text x="305" y="235" font-size="17" fill="#426caa" text-anchor="start">+Z=(0,-29.3939)</text><text x="40" y="520" font-size="19" fill="#334155" text-anchor="start">地面斜率 ±0.5 / 轴线倾角 26.565°</text><text x="40" y="552" font-size="16" fill="#64748b" text-anchor="start">上图仅等比放大 4 倍；相机仰角另为 30°</text><line x1="590.0000" y1="90.0000" x2="590.0000" y2="568.0000" stroke="#d7e0eb" stroke-width="1.2" /><text x="630" y="119" font-size="20" fill="#334155" text-anchor="start">轴对齐家具：主要硬边必须平行同组地线</text><line x1="875.0000" y1="206.0000" x2="587.0000" y2="350.0000" stroke="#dbe3eb" stroke-width="1.2" /><line x1="875.0000" y1="206.0000" x2="1163.0000" y2="350.0000" stroke="#dbe3eb" stroke-width="1.2" /><line x1="947.0000" y1="242.0000" x2="659.0000" y2="386.0000" stroke="#dbe3eb" stroke-width="1.2" /><line x1="803.0000" y1="242.0000" x2="1091.0000" y2="386.0000" stroke="#dbe3eb" stroke-width="1.2" /><line x1="1019.0000" y1="278.0000" x2="731.0000" y2="422.0000" stroke="#dbe3eb" stroke-width="1.2" /><line x1="731.0000" y1="278.0000" x2="1019.0000" y2="422.0000" stroke="#dbe3eb" stroke-width="1.2" /><line x1="1091.0000" y1="314.0000" x2="803.0000" y2="458.0000" stroke="#dbe3eb" stroke-width="1.2" /><line x1="659.0000" y1="314.0000" x2="947.0000" y2="458.0000" stroke="#dbe3eb" stroke-width="1.2" /><line x1="1163.0000" y1="350.0000" x2="875.0000" y2="494.0000" stroke="#dbe3eb" stroke-width="1.2" /><line x1="587.0000" y1="350.0000" x2="875.0000" y2="494.0000" stroke="#dbe3eb" stroke-width="1.2" /><line x1="803.0000" y1="314.0000" x2="947.0000" y2="386.0000" stroke="#27394d" stroke-width="4" /><line x1="803.0000" y1="254.0000" x2="947.0000" y2="295.2913" stroke="#d65b50" stroke-width="4" /><text x="635" y="205" font-size="17" fill="#ba4a40" text-anchor="start">红：示例原画硬边约 16°，与地面不一致</text><text x="635" y="475" font-size="18" fill="#334155" text-anchor="start">黑：规范地面轴 26.565°</text><text x="635" y="521" font-size="16" fill="#64748b" text-anchor="start">旋转 45° 的物体另按八向模板判断</text><text x="635" y="551" font-size="16" fill="#64748b" text-anchor="start">不能给所有朝向强套同一组斜线</text></svg>