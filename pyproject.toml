[project]
name = "roomcrew"
version = "0.1.0"
description = "A local-first digital studio with configurable AI coworkers."
readme = "README.md"
requires-python = ">=3.13.17,<3.14"
dependencies = [
    "deepagents==0.7.32",
    "langchain-openai>=1.7.2,<2",
    "langchain-mcp-adapters>=0.3.2,<0.4",
    "langgraph-checkpoint-sqlite>=3.1.2,<4",
    "pywebview>=6,<7",
    "pillow>=13,<14",
    "apscheduler>=3.11,<4",
    "tzdata>=2025.2",
]

[dependency-groups]
build = [
    "pyinstaller>=6.22,<7",
]
dev = [
    "mypy>=2.4.0,<3",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "ruff>=0.17.2,<0.18",
]

[tool.uv]
package = false
required-version = ">=0.13.5,<0.14"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["backend/src", "desktop/src"]
extend-exclude = ["main.py", ".tools", ".cache", "work"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 中文文档和界面需要使用中文标点。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# 独立验证和素材脚本先定位源码，不依赖用户全局 PYTHONPATH。
"desktop/tests/*_smoke.py" = ["E402"]
"desktop/tools/python/*.py" = ["E402"]
"backend/tests/live_agent_verification.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["backend/src", "desktop/src"]
mypy_path = ["backend/src", "desktop/src"]

[tool.pytest.ini_options]
testpaths = ["backend", "desktop/tests"]
pythonpath = ["backend/src", "backend/tests", "desktop/src", "desktop/tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: installed components without a live model or external service",
    "live: requires credentials and explicit opt-in; excluded from normal checks",
]
